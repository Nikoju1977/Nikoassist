name: NikoAssist - iOS unsigned device build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

concurrency:
  group: nikoassist-ios-build
  cancel-in-progress: false

jobs:
  ios-device:
    name: Compile iOS device app with Xcode (no Apple signing)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout published full-source branch and native submodules
        uses: actions/checkout@v4
        with:
          ref: source-nikoassist
          submodules: recursive
          persist-credentials: false

      - name: Verify Xcode and device SDK
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test -d android/src/ios/Minis.xcodeproj
          test -d android/deps/ish

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install meson ninja llvm lld libarchive pkg-config
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          test -x "$(brew --prefix lld)/bin/ld.lld"

      - name: Smoke-test Linux-arm64 LLVM linker required by iSH
        shell: bash
        run: |
          set -euo pipefail
          LLVM_CLANG="$(brew --prefix llvm)/bin/clang"
          printf 'void probe(void) {}\n' | "$LLVM_CLANG" -target aarch64-linux-gnu -fuse-ld=lld -nostdlib -shared -fPIC -x c - -o "$RUNNER_TEMP/nikoassist-vdso-probe.so"
          test -s "$RUNNER_TEMP/nikoassist-vdso-probe.so"

      - name: Build LAME (iOS arm64)
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          bash deps/build_lame.sh
          test -s deps/lame-build/lib/libmp3lame.a

      - name: Build FFmpeg frameworks (iOS arm64)
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          bash deps/build_ffmpeg.sh
          test -d deps/frameworks/FFmpeg.framework

      - name: Build iSH iOS sandbox kernel
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          bash deps/build_ish.sh
          test -d deps/libs
          test -d deps/include

      - name: Prepare Alpine rootfs for iOS
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          bash deps/prepare_alpine_rootfs.sh
          test -d deps/resources

      - name: Set up Go for iOS rclone library
        uses: actions/setup-go@v5
        with:
          go-version-file: android/deps/rclone-mobile/go.mod
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - name: Build rclone XCFramework for iOS
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          bash deps/build_rclone_ios.sh
          test -d deps/frameworks/Rclone.xcframework

      - name: Compile NikoAssist iOS app for physical devices without signing
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NikoAssist-iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d "$RUNNER_TEMP/NikoAssist-iOS/Build/Products/Debug-iphoneos/Minis.app"

      - name: Archive the unsigned .app for inspection
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NikoAssist-iOS/Build/Products/Debug-iphoneos/Minis.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/NikoAssist-iOS-unsigned-app.zip"
          shasum -a 256 "$RUNNER_TEMP/NikoAssist-iOS-unsigned-app.zip" > "$RUNNER_TEMP/NikoAssist-iOS-SHA256SUMS.txt"

      - name: Publish unsigned iOS build as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikoAssist-iOS-arm64-unsigned-app
          path: |
            ${{ runner.temp }}/NikoAssist-iOS-unsigned-app.zip
            ${{ runner.temp }}/NikoAssist-iOS-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
