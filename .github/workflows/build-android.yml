name: NikoAssist - Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: nikoassist-android-build
  cancel-in-progress: false

jobs:
  android-debug:
    name: Build unsigned-for-release Android debug APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout published full-source branch and native submodules
        uses: actions/checkout@v4
        with:
          ref: source-nikoassist
          submodules: recursive
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK and command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

      - name: Build PRoot native binaries (do not skip loaders)
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          bash deps/build_proot.sh
          test -s src/android/app/src/main/assets/proot-aarch64
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so

      - name: Prepare Alpine Linux root filesystem
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          bash scripts/prepare_android_sandbox.sh
          test -s src/android/app/src/main/assets/alpine-minirootfs.tar.gz

      - name: Set up Go for rclone mobile bindings
        uses: actions/setup-go@v5
        with:
          go-version-file: android/deps/rclone-mobile/go.mod
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - name: Compile rclone Android AAR (required Gradle dependency)
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          bash deps/build_rclone_android.sh
          install -D deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          test -s src/android/app/libs/rclone.aar

      - name: Build Android debug APK
        shell: bash
        working-directory: android/src/android
        run: |
          set -euo pipefail
          cp app/provider-customization.properties.example app/provider-customization.properties
          # Kotlin compiler OOMed with the 2 GiB default Gradle heap on GitHub runners.
          # Run Kotlin inside the bounded Gradle JVM to avoid a second large daemon.
          # Limit workers so native packaging and Kotlin do not exhaust runner RAM.
          free -m
          bash ./gradlew --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4608m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK assets and record SHA256
        shell: bash
        working-directory: android/src/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot-loader.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot-loader32.so'
          unzip -l "$APK" | grep -q 'assets/alpine-minirootfs.tar.gz'
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish Android APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikoAssist-Android-arm64-debug
          path: |
            android/src/android/app/build/outputs/apk/debug/*.apk
            android/src/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
