name: Publish NikoAssist full-source branch

on:
  push:
    branches: [main]
    paths:
      - 'nanomuse/nikoassist/**'
      - 'scripts/install_nikoassist.py'
      - '.github/workflows/publish-full-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout NikoAssist overlay
        uses: actions/checkout@v4

      - name: Clone pinned GPL nanoMuse
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/nano-muse/nanoMuse.git upstream
          git -C upstream fetch --depth 1 origin 34439cf8a82e8163004fae14c731c87fd6e69ebf
          git -C upstream checkout --detach 34439cf8a82e8163004fae14c731c87fd6e69ebf

      - name: Overlay NikoAssist and check syntax
        shell: bash
        run: |
          python scripts/install_nikoassist.py --target upstream
          python -m compileall -q upstream/nanomuse/nikoassist upstream/nanomuse/app.py
          test -f upstream/LICENSE
          grep -q 'NIKOASSIST_AGENT_TEAM_V1' upstream/nanomuse/app.py

      - name: Update full-source branch (fast-forward, no force)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          cd upstream
          git config user.name "NikoAssist Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add publish "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
          if git ls-remote --exit-code publish refs/heads/source-nikoassist >/dev/null 2>&1; then
            git fetch --no-tags publish refs/heads/source-nikoassist
            git checkout -B source-nikoassist FETCH_HEAD
            # Apply overlay again to the existing full-source branch, preserving
            # its unrelated history and updating previously integrated files.
            python "${GITHUB_WORKSPACE}/scripts/install_nikoassist.py" --target "${PWD}"
          else
            # First publication: isolated root commit. The action token does
            # not have permission to publish upstream workflow files.
            git checkout --orphan source-nikoassist
            rm -rf .github/workflows
          fi
          python -m compileall -q nanomuse/nikoassist nanomuse/app.py
          test -f LICENSE
          git add -A
          if git diff --cached --quiet; then
            echo "Full source is already synchronized"
            exit 0
          fi
          git commit -m "chore: synchronize NikoAssist GPL full source"
          # Refuse races and non-fast-forward updates (never force push).
          git push publish HEAD:refs/heads/source-nikoassist
