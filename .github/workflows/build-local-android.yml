name: NikoAssist Local — Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "local-android/**"
      - ".github/workflows/build-local-android.yml"

permissions:
  contents: read

jobs:
  offline-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout NikoAssist overlay
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout reviewed llama.cpp Android inference engine
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: c6fb3b5be2209f6c12339833198190f6f6829581
          path: thirdparty/llama-cpp
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android native toolchains
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Prepare GPL NikoAssist Local overlay
        run: python3 local-android/prepare.py --llama thirdparty/llama-cpp

      - name: Build offline arm64 APK
        working-directory: thirdparty/llama-cpp/examples/llama.android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3072m
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify app identifier and no INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          apk=thirdparty/llama-cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" | grep "package: name='fr.nikostudio.nikoassist.local'"
          "$aapt" dump badging "$apk" | grep "application-label:'NikoAssist Local'"
          "$aapt" dump permissions "$apk" > /tmp/nikoassist-permissions.txt
          if grep -q "android.permission.INTERNET" /tmp/nikoassist-permissions.txt; then
            echo "::error::Offline APK unexpectedly requests INTERNET"
            exit 1
          fi
          echo "Confirmed arm64 NikoAssist Local APK without INTERNET permission"

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp thirdparty/llama-cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk \
            dist/NikoAssist-Local-S20FE5G-debug.apk
          (cd dist && sha256sum NikoAssist-Local-S20FE5G-debug.apk > SHA256SUMS.txt)

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: NikoAssist-Local-S20FE5G
          path: dist/
          retention-days: 30
          if-no-files-found: error
