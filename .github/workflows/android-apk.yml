name: NikoAssist Android APK (experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: nikoassist-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout complete source with native submodules
        uses: actions/checkout@v4
        with:
          ref: source-nikoassist
          submodules: recursive
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/src/android/**/*.gradle*

      - name: Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make curl tar xz-utils zstd
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Validate native source and prepare unsigned provider config
        shell: bash
        run: |
          set -euo pipefail
          test -d android/deps/proot/src
          test -f android/src/android/gradle/wrapper/gradle-wrapper.jar
          cp android/src/android/app/provider-customization.properties.example android/src/android/app/provider-customization.properties

      - name: Build PRoot and Alpine sandbox assets
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash deps/build_proot.sh
          bash scripts/prepare_android_sandbox.sh
          test -s src/android/app/src/main/assets/proot-aarch64
          test -s src/android/app/src/main/assets/alpine-minirootfs.tar.gz
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android/src/android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish checksum
        shell: bash
        run: |
          cd android/src/android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt

      - name: Upload APK and checksum (unsigned for store, debug-signed for local testing)
        uses: actions/upload-artifact@v4
        with:
          name: NikoAssist-Android-debug-arm64
          path: |
            android/src/android/app/build/outputs/apk/debug/app-debug.apk
            android/src/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
