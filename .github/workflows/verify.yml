name: NikoAssist - tests and upstream compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Security and reliability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10' 'pydantic>=2,<3' 'cryptography>=42,<48'
      - name: Run regression tests
        run: python -m pytest -q tests/
      - name: Compile agent and installer
        run: python -m compileall -q nanomuse/nikoassist scripts

  upstream-integration:
    name: Apply to pinned nanoMuse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone the inspected upstream revision
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/nano-muse/nanoMuse.git upstream
          git -C upstream fetch --depth 1 origin 34439cf8a82e8163004fae14c731c87fd6e69ebf
          git -C upstream checkout --detach 34439cf8a82e8163004fae14c731c87fd6e69ebf
      - name: Check all patches without touching the source
        run: python scripts/install_nikoassist.py --target upstream --dry-run
      - name: Install once, then check idempotency
        shell: bash
        run: |
          python scripts/install_nikoassist.py --target upstream
          python scripts/install_nikoassist.py --target upstream | tee second-install.txt
          grep -q '^0 fichier(s)' second-install.txt
      - name: Validate Python syntax and native branding anchors
        shell: bash
        run: |
          python -m compileall -q upstream/nanomuse/nikoassist upstream/nanomuse/app.py
          grep -q 'NIKOASSIST_AGENT_TEAM_V1' upstream/nanomuse/app.py
          grep -q 'NikoAssist' upstream/android/src/ios/Minis.xcodeproj/project.pbxproj
          grep -q 'NikoAssist' upstream/android/src/android/app/src/main/res/values/strings.xml
          git -C upstream diff --stat > integration-summary.txt
      - name: Install actual nanoMuse dependencies and import integrated agent
        shell: bash
        run: |
          python -m pip install -e ./upstream
          cd upstream
          python - <<'PY'
          from nanomuse.nikoassist.tool import NikoAssistTeamTool
          from nanomuse.schema import RiskLevel
          from nanomuse.tools.base import BaseTool
          from nanomuse.nikoassist.core import should_halt
          assert issubclass(NikoAssistTeamTool, BaseTool)
          team = NikoAssistTeamTool(app=object())
          assert team.name == "agent_team"
          assert team.assess({"goal": "test", "mode": "act"}).risk == RiskLevel.SENSITIVE
          assert should_halt("unknown", "act")
          print("Native nanoMuse integration import: OK")
          PY
      - name: Verify Mistral provider and encrypted vault with nonworking test key
        shell: bash
        run: |
          export NIKO_TEST_DATA_DIR="$RUNNER_TEMP/niko-mistral-test"
          # Run inside upstream: repository overlay has a partial nanomuse namespace.
          (cd upstream && python - <<'PY'
          import json
          import os
          from pathlib import Path
          from nanomuse.config import (
              Settings, apply_app_settings, load_app_settings, save_app_settings,
          )
          from nanomuse.llm import catalogue
          from nanomuse.llm.factory import llm_ready
          from nanomuse.nikoassist.mistral import configure_mistral, mistral_status
          from nanomuse.vault import CredentialVault

          directory = Path(os.environ["NIKO_TEST_DATA_DIR"])
          directory.mkdir(parents=True, exist_ok=True)
          assert catalogue.load().get("mistral").protocol == "openai"
          save_app_settings(directory, {
              "llm": {"provider": "deepseek", "base_url": "https://api.deepseek.com"},
              "calendar": {"enabled": True},
          })
          demo_key = "ci-fake-mistral-key-NOT-VALID-NO-NETWORK"
          report = configure_mistral(data_dir=directory, secret=demo_key)
          assert report["network_verified"] is False
          settings = Settings(data_dir=directory)
          apply_app_settings(settings, load_app_settings(directory))
          assert settings.llm.provider == "mistral"
          assert settings.llm.endpoint == "https://api.mistral.ai/v1"
          assert settings.llm.model == "mistral-small-latest"
          assert settings.llm.api_key == "{{vault:MISTRAL_API_KEY}}"
          assert load_app_settings(directory)["calendar"]["enabled"]
          vault = CredentialVault(settings.vault_file, settings.vault_key_file)
          assert vault.resolve(settings.llm.api_key) == demo_key
          assert llm_ready(settings.llm, vault, directory)
          assert mistral_status(data_dir=directory)["ready_offline"]
          assert demo_key not in (directory / "app-settings.json").read_text()
          assert demo_key.encode() not in (directory / "vault.enc").read_bytes()
          assert (directory / "vault.key").stat().st_mode & 0o077 == 0
          assert (directory / "vault.enc").stat().st_mode & 0o077 == 0
          print("Mistral + native encrypted vault integration: OK (offline)")
          PY
          )
          python scripts/configure_mistral.py --target upstream --data-dir "$NIKO_TEST_DATA_DIR" --check
          python scripts/configure_mistral.py --target upstream --data-dir "$NIKO_TEST_DATA_DIR" --use-existing --model mistral-small-latest
      - uses: actions/upload-artifact@v4
        with:
          name: integration-summary
          path: integration-summary.txt
