<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10192b">
<title>Hors ligne · NikoAssist</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#10192b;color:#eef7ff;padding:24px}
main{max-width:410px;text-align:center}.logo{width:104px;height:104px;border-radius:23px}
h1{font-size:26px;letter-spacing:-.03em;margin:25px 0 12px}p{font-size:16px;color:#b5c5d6;line-height:1.6}
button{border:0;border-radius:14px;background:#3be2d0;color:#10192b;font:700 16px system-ui;padding:14px 25px;cursor:pointer;margin-top:20px}
small{display:block;margin-top:28px;color:#93a8bb}
</style>
</head>
<body>
<main>
  <img class="logo" src="/icon.svg" width="104" height="104" alt="NikoAssist">
  <h1>NikoAssist est hors ligne</h1>
  <p>Reconnecte-toi à Internet et à ton serveur NikoAssist pour retrouver les conversations et exécuter des actions. Aucune donnée personnelle n'est enregistrée dans le cache hors ligne.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
  <small>Par Niko Studio Design</small>
</main>
</body>
